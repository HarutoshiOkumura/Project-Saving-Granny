<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your room</title>
<!--
  The 3D room view (docs/SPLAT.md). Static, no build step.

  The room is a Gaussian splat built by scripts/build_room.py. Things are NOT shown where they
  were when the room was scanned: the page asks GET /room/scene where the memory says each thing
  is now and points at that landmark's pin. Data calls carry the app token, taken once from
  the address (#token=...) or typed in, and kept for this tab only.

  three.js and Spark are served by the backend from app/web/vendor/ (see docs/SPLAT.md).
-->
<script type="importmap">
{
  "imports": {
    "three": "/room/lib/three.module.min.js",
    "three/addons/": "/room/lib/addons/",
    "@sparkjsdev/spark": "/room/lib/spark.module.js"
  }
}
</script>
<style>
  /* docs/DASHBOARD.md: Atkinson Hyperlegible when the device has it, body 28 px, AAA contrast,
     touch targets at least 72 px, never colour alone. */
  :root {
    --ink: #111111; --paper: #ffffff; --accent: #0842a0; --alert: #8c1d18;
    --band: rgba(17, 17, 17, 0.86);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1b1b1b; color: var(--ink);
    font: 28px/1.5 "Atkinson Hyperlegible", "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  /* The room sits above the panel, never behind it, so its middle is the middle you can see. */
  #view { position: relative; flex: 1 1 auto; min-height: 30vh; overflow: hidden; }
  #stage { position: absolute; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #pins { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  .pin { position: absolute; left: 0; top: 0; will-change: transform; display: none; }
  .pin .dot { position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; border-radius: 50%;
    background: var(--paper); border: 6px solid var(--accent); }
  .pin .name { position: absolute; left: 22px; top: -24px; white-space: nowrap; padding: 2px 14px;
    border-radius: 10px; background: var(--band); color: #fff; font-size: 24px; }
  .pin.here .dot { border-color: #fff; background: var(--accent); width: 40px; height: 40px; left: -20px; top: -20px; }
  .pin.here .dot::after { content: ""; position: absolute; inset: -22px; border-radius: 50%;
    border: 6px solid #fff; animation: ring 1.6s ease-out infinite; }
  .pin.here .name { font-size: 30px; font-weight: 700; background: var(--accent); top: -30px; left: 32px; }
  .pin.gone .dot { border-style: dashed; }
  @keyframes ring { from { transform: scale(0.5); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pin.here .dot::after { animation: none; } }

  header { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 16px; align-items: center;
    padding: 12px 20px; pointer-events: none; }
  header h1 { margin: 0; font-size: 32px; color: #fff; text-shadow: 0 1px 6px #000; }
  #chip { padding: 2px 16px; border-radius: 999px; background: var(--band); color: #fff; font-size: 22px; }
  #voice { margin-left: auto; pointer-events: auto; }
  #edit { pointer-events: auto; }

  button { font: inherit; min-height: 72px; padding: 8px 28px; border-radius: 16px; cursor: pointer;
    border: 4px solid var(--accent); background: var(--paper); color: var(--accent); font-weight: 700; }
  button:focus-visible { outline: 6px solid #ffbf00; outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  button.small { min-height: 72px; font-size: 22px; padding: 6px 18px; }

  #panel { flex: 0 0 auto; background: var(--paper);
    border-top: 4px solid var(--ink); padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    max-height: 60vh; overflow-y: auto; }
  #answer { display: none; gap: 20px; align-items: center; margin-bottom: 14px; }
  #answer.on { display: flex; }
  #answer p { margin: 0; font-size: 34px; line-height: 1.35; flex: 1; }
  #answer .note { display: block; font-size: 24px; margin-top: 6px; }
  #photo { position: relative; flex: 0 0 auto; width: min(38vw, 360px); aspect-ratio: 16 / 9; display: none;
    border: 4px solid var(--ink); border-radius: 12px; overflow: hidden; background: #ddd; }
  #photo.on { display: block; }
  #photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #photo i { position: absolute; border: 5px solid #fff; border-radius: 50%; box-shadow: 0 0 0 3px var(--accent); }
  #things, #places { display: flex; flex-wrap: wrap; gap: 12px; }
  #places { display: none; }
  body.editing #places { display: flex; }
  body.editing #things, body.editing #answer { display: none; }
  #hint { display: none; margin: 0 0 12px; }
  body.editing #hint { display: block; }
  #message { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; background: var(--paper); }
  #message.on { display: grid; }
  #message div { max-width: 26em; }
  #message input { font: inherit; width: 100%; min-height: 72px; padding: 8px 16px; border: 4px solid var(--ink);
    border-radius: 12px; margin: 12px 0; }
  code { font-size: 0.8em; background: #eee; padding: 2px 8px; border-radius: 6px; word-break: break-all; }
</style>
</head>
<body>
<div id="view">
  <div id="stage" aria-label="A 3D view of your room"></div>
  <div id="pins" aria-hidden="true"></div>
  <header>
    <h1>Your room</h1>
    <span id="chip" role="status">Loading…</span>
    <button id="voice" class="small" aria-pressed="false">Read aloud: off</button>
    <button id="edit" class="small" aria-pressed="false">Place pins</button>
  </header>
</div>
<section id="panel">
  <div id="answer" aria-live="polite">
    <p><span id="sentence"></span><span id="note" class="note"></span></p>
    <div id="photo"><img alt="Where it was last seen"><i hidden></i></div>
  </div>
  <p id="hint">Choose a place, then tap it in the room.</p>
  <div id="things" role="group" aria-label="Your things"></div>
  <div id="places" role="group" aria-label="Places in the room"></div>
</section>
<div id="message" role="alert"><div></div></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

const POLL_MS = 5000;      // how often the page asks the memory where things are
const FLY_MS = 1200;
const $ = (id) => document.getElementById(id);

// ---- the app token: from #token=..., else typed once; kept for this tab only -----------------
function takeToken() {
  const fromHash = new URLSearchParams(location.hash.slice(1)).get("token");
  if (fromHash) {
    sessionStorage.setItem("app_token", fromHash);
    history.replaceState(null, "", location.pathname + location.search);  // out of the address bar
  }
  return sessionStorage.getItem("app_token");
}
let token = takeToken();

function say(html) { $("message").firstElementChild.innerHTML = html; $("message").classList.add("on"); }
function unsay() { $("message").classList.remove("on"); }

function askForToken(wrong) {
  say(`<p>${wrong ? "That token was not accepted." : "This page shows the inside of a home."} Type the app token to open it.</p>
       <form><input type="password" autocomplete="off" aria-label="App token"><button>Open</button></form>`);
  $("message").querySelector("form").addEventListener("submit", (event) => {
    event.preventDefault();
    token = event.target.querySelector("input").value.trim();
    sessionStorage.setItem("app_token", token);
    unsay();
    start();
  });
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: { Authorization: `Bearer ${token}`, ...(options.headers || {}) },
  });
  if (response.status === 401) { askForToken(true); throw new Error("token"); }
  return response;
}

// ---- three.js and Spark ---------------------------------------------------------------------
const stage = $("stage");
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1b1b);
const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 200);
const spark = new SparkRenderer({ renderer });   // Spark 2 draws nothing without this in the scene
scene.add(spark);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

function resize() {
  const { clientWidth: w, clientHeight: h } = stage;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);   // the panel grows when an answer shows
resize();

// ---- state ----------------------------------------------------------------------------------
let room = null;           // the last GET /room/scene
let splat = null;          // the SplatMesh on screen
let shownLevel = null, shownVersion = null;
let selected = null;       // the item whose answer is showing
let placing = null;        // the landmark address a tap will pin (edit mode)
let flight = null;
const pinNodes = new Map(); // address -> element

const vec = (a) => new THREE.Vector3(a[0], a[1], a[2]);

async function loadSplat(level) {
  const response = await api(`/room/splat?level=${level}`);
  if (!response.ok) throw new Error(`splat ${response.status}`);
  const bytes = new Uint8Array(await response.arrayBuffer());
  const mesh = new SplatMesh({ fileBytes: bytes, fileName: `${level}.spz` });
  await mesh.initialized;
  scene.add(mesh);                       // swap only once the new one is ready; the camera stays
  if (splat) { scene.remove(splat); splat.dispose?.(); }
  splat = mesh;
  shownLevel = level;
}

async function showRoom() {
  const version = room.version;
  const wasShowing = splat !== null;
  if (!wasShowing) {
    camera.position.copy(vec(room.start.eye));
    controls.target.copy(vec(room.start.target));
    controls.update();
  }
  const first = room.levels.includes("preview") ? "preview" : "full";
  $("chip").textContent = wasShowing ? "A newer scan is loading…" : "Loading your room…";
  await loadSplat(first);
  if (first === "preview" && room.levels.includes("full")) {
    $("chip").textContent = "Sharpening…";
    await loadSplat("full");
  }
  shownVersion = version;
  $("chip").textContent = shownLevel === "full" ? "Ready" : "Sharpening…";
}

// ---- pins: DOM labels placed over the canvas every frame ---------------------------------------
function syncPins() {
  const wanted = new Set(room.pins.filter((p) => p.position).map((p) => p.address));
  for (const [address, node] of pinNodes) if (!wanted.has(address)) { node.remove(); pinNodes.delete(address); }
  for (const pin of room.pins) {
    if (!pin.position) continue;
    let node = pinNodes.get(pin.address);
    if (!node) {
      node = document.createElement("div");
      node.className = "pin";
      node.innerHTML = '<span class="dot"></span><span class="name"></span>';
      $("pins").appendChild(node);
      pinNodes.set(pin.address, node);
    }
    node.position3d = vec(pin.position);
    node.spoken = pin.spoken;
  }
  labelPins();
}

function labelPins() {
  const thing = selected && room.things.find((t) => t.item === selected);
  for (const [address, node] of pinNodes) {
    const here = Boolean(thing && thing.address === address);
    node.classList.toggle("here", here);
    node.classList.toggle("gone", here && thing.state === "not_there_anymore");
    node.querySelector(".name").textContent = here
      ? (thing.state === "not_there_anymore" ? `${thing.item} was here` : `${thing.item} here`)
      : node.spoken;
  }
}

const projected = new THREE.Vector3();
function placePins() {
  const { clientWidth: w, clientHeight: h } = stage;
  for (const node of pinNodes.values()) {
    projected.copy(node.position3d).project(camera);
    const visible = projected.z > -1 && projected.z < 1;
    node.style.display = visible ? "block" : "none";
    if (visible) {
      node.style.transform = `translate(${((projected.x + 1) / 2) * w}px, ${((1 - projected.y) / 2) * h}px)`;
    }
  }
}

// ---- flying to a place ------------------------------------------------------------------------
// Splats look best from where the scan's cameras stood, so stand where the camera that looked
// most directly at the place stood, moved in to a comfortable distance.
function standpointFor(target) {
  const size = vec(room.bounds.max).sub(vec(room.bounds.min)).length();
  const comfortable = THREE.MathUtils.clamp(size * 0.22, 0.15, 3);
  let best = null, bestScore = -Infinity;
  for (const view of room.views.length ? room.views : [room.start]) {
    const eye = vec(view.eye);
    const toTarget = target.clone().sub(eye);
    const distance = toTarget.length();
    if (distance < 1e-6) continue;
    const facing = toTarget.normalize().dot(vec(view.target).sub(eye).normalize());
    const score = facing - 0.15 * Math.abs(distance - comfortable) / comfortable;
    if (score > bestScore) { bestScore = score; best = eye; }
  }
  if (!best) best = camera.position.clone();
  const away = best.clone().sub(target);
  const distance = THREE.MathUtils.clamp(away.length(), comfortable * 0.7, comfortable * 1.6);
  return target.clone().add(away.normalize().multiplyScalar(distance));
}

function flyTo(target) {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  flight = {
    fromEye: camera.position.clone(), toEye: standpointFor(target),
    fromTarget: controls.target.clone(), toTarget: target.clone(),
    started: performance.now(), length: reduce ? 1 : FLY_MS,
  };
}

function stepFlight(now) {
  if (!flight) return;
  const t = Math.min(1, (now - flight.started) / flight.length);
  const eased = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  camera.position.lerpVectors(flight.fromEye, flight.toEye, eased);
  controls.target.lerpVectors(flight.fromTarget, flight.toTarget, eased);
  if (t >= 1) flight = null;
}
controls.addEventListener("start", () => { flight = null; });   // a finger takes over at once

// ---- things: one large button each; the answer is written and stays (spoken if switched on) ---
function syncThings() {
  const box = $("things");
  const names = room.things.map((t) => t.item).join("|");
  if (box.dataset.names !== names) {
    box.dataset.names = names;
    box.replaceChildren(...room.things.map((thing) => {
      const button = document.createElement("button");
      button.textContent = thing.item[0].toUpperCase() + thing.item.slice(1);
      button.dataset.item = thing.item;
      button.addEventListener("click", () => choose(thing.item, true));
      return button;
    }));
  }
  for (const button of box.children) button.setAttribute("aria-pressed", String(button.dataset.item === selected));
}

let photoFor = null;
async function showPhoto(thing) {
  const frame = $("photo"), image = frame.querySelector("img"), ring = frame.querySelector("i");
  const wanted = thing.sighting_id && thing.address ? thing.sighting_id : null;
  if (wanted === photoFor) return;
  photoFor = wanted;
  frame.classList.remove("on");
  if (!wanted) return;
  try {
    const response = await api(`/moments/${wanted}/photo?w=640&h=360`);
    if (!response.ok || photoFor !== wanted) return;
    const circle = response.headers.get("X-Item-Circle");
    if (image.src) URL.revokeObjectURL(image.src);
    image.src = URL.createObjectURL(await response.blob());
    ring.hidden = !circle;
    if (circle) {
      const [x, y, r] = circle.split(",").map(Number);
      Object.assign(ring.style, {
        left: `${((x - r) / 640) * 100}%`, top: `${((y - r) / 360) * 100}%`,
        width: `${((2 * r) / 640) * 100}%`, height: `${((2 * r) / 360) * 100}%`,
      });
    }
    frame.classList.add("on");
  } catch { /* the answer never waits on the photo */ }
}

function choose(item, byHand) {
  selected = item;
  const thing = room.things.find((t) => t.item === item);
  if (!thing) { selected = null; $("answer").classList.remove("on"); syncThings(); labelPins(); return; }
  $("sentence").textContent = thing.sentence;
  const pin = thing.address && room.pins.find((p) => p.address === thing.address);
  $("note").textContent = thing.address && !(pin && pin.position)
    ? "That place has no pin in the room yet. Use Place pins to add one." : "";
  $("answer").classList.add("on");
  syncThings();
  labelPins();
  showPhoto(thing);
  if (byHand) {
    if (pin && pin.position) flyTo(vec(pin.position));
    if (aloud && "speechSynthesis" in window) {
      speechSynthesis.cancel();
      const words = new SpeechSynthesisUtterance(thing.sentence);
      words.rate = 0.9;
      speechSynthesis.speak(words);
    }
  }
}

// ---- reading the answer aloud: OFF unless switched on --------------------------------------
// The page often sits beside a FaceTime call, and the call's microphone hears the speakers: on
// 15 Nov the agent took this page's voice for the caller's. So it is silent by default.
let aloud = false;
$("voice").addEventListener("click", () => {
  aloud = !aloud;
  $("voice").setAttribute("aria-pressed", String(aloud));
  $("voice").textContent = aloud ? "Read aloud: on" : "Read aloud: off";
  if (!aloud && "speechSynthesis" in window) speechSynthesis.cancel();
});

// ---- placing pins (the family, once per landmark) ---------------------------------------------
function syncPlaces() {
  $("places").replaceChildren(...room.pins.map((pin) => {
    const button = document.createElement("button");
    button.textContent = `${pin.spoken}${pin.position ? " ✓ placed" : ""}`;
    button.setAttribute("aria-pressed", String(placing === pin.address));
    button.addEventListener("click", () => {
      placing = placing === pin.address ? null : pin.address;
      $("hint").textContent = placing ? `Now tap ${pin.spoken} in the room.` : "Choose a place, then tap it in the room.";
      syncPlaces();
    });
    return button;
  }));
}

$("edit").addEventListener("click", () => {
  const on = !document.body.classList.contains("editing");
  document.body.classList.toggle("editing", on);
  $("edit").setAttribute("aria-pressed", String(on));
  $("edit").textContent = on ? "Done" : "Place pins";
  placing = null;
  $("hint").textContent = "Choose a place, then tap it in the room.";
  syncPlaces();
});

let down = null;
renderer.domElement.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener("pointerup", async (e) => {
  const moved = down ? Math.hypot(e.clientX - down.x, e.clientY - down.y) : 99;
  down = null;
  if (!placing || moved > 8) return;                  // a drag turns the room; only a tap pins
  const box = renderer.domElement.getBoundingClientRect();
  const point = new THREE.Vector2(((e.clientX - box.left) / box.width) * 2 - 1, -((e.clientY - box.top) / box.height) * 2 + 1);
  const ray = new THREE.Raycaster();
  ray.setFromCamera(point, camera);
  const address = placing;
  $("hint").textContent = "Placing…";
  try {
    const response = await api("/room/pins", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ address, origin: ray.ray.origin.toArray(), direction: ray.ray.direction.toArray() }),
    });
    if (response.ok) {
      const placed = await response.json();
      const pin = room.pins.find((p) => p.address === address);
      pin.position = placed.position;
      placing = null;
      $("hint").textContent = `${placed.spoken} is placed. Choose another place, or press Done.`;
      syncPins();
      syncPlaces();
    } else {
      $("hint").textContent = response.status === 422
        ? "That tap did not land on anything. Tap right on the surface." : "That could not be saved. Try again.";
    }
  } catch { $("hint").textContent = "That could not be saved. Try again."; }
});

// ---- load, then keep asking the memory ---------------------------------------------------------
async function refresh() {
  const response = await api("/room/scene");
  if (response.status === 404) {
    say(`<p>There is no room scan yet.</p><p>Film a slow 20 to 40 second walk around the room, then run<br>
         <code>uv run python -m scripts.build_room your-video.mov</code></p>`);
    return false;
  }
  if (!response.ok) throw new Error(`scene ${response.status}`);
  room = await response.json();
  unsay();
  syncPins();
  syncThings();
  if (document.body.classList.contains("editing") && !placing) syncPlaces();
  if (selected) choose(selected, false);              // the sentence follows the memory
  return true;
}

let loading = false;
async function tick() {
  if (document.hidden || loading) return;
  loading = true;
  try {
    if ((await refresh()) && room.version !== shownVersion) await showRoom();
  } catch (error) {
    if (error.message !== "token") $("chip").textContent = "Trying to reconnect…";
  } finally { loading = false; }
}

async function start() {
  if (!token) { askForToken(false); return; }
  await tick();
}

renderer.setAnimationLoop((now) => {
  stepFlight(now);
  controls.update();
  renderer.render(scene, camera);
  if (room) placePins();
});
setInterval(tick, POLL_MS);
document.addEventListener("visibilitychange", tick);
window.roomView = { camera, controls, scene, get room() { return room; }, get splat() { return splat; }, choose, loadSplat };
start();
</script>
</body>
</html>
