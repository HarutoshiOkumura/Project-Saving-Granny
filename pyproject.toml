[project]
name = "save-it"
version = "0.1.0"
description = "A phone number a person with dementia can call to ask where their things are."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.33",
    "supabase>=2.34.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
