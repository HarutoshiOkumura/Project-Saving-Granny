[project]
name = "save-it"
version = "0.1.0"
description = "A phone number a person with dementia can call to ask where their things are."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.0",
    "google-genai>=3.3.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.33",
    "supabase>=2.34.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The repo's supabase/ folder holds SQL; without this, ruff sorts the supabase package as ours.
known-third-party = ["supabase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["live: calls paid APIs with the real .env; skipped unless RUN_LIVE=1"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
